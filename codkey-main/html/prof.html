<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiaFit - Professores</title>
    <!-- Vinculando o mesmo arquivo CSS centralizado -->
    <link rel="stylesheet" href="../css/prof.css">
    <link rel="stylesheet" href="../css/tema-roxo.css">
</head>
<body>
<script>if(!sessionStorage.getItem('academiafit_usuario')){window.location.replace('login.html');}</script>


    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="navbar">
        <div class="logo-container">
            <span class="logo-icon">🏋️</span>
            <span class="brand-name">AcademiaFit</span>
        </div>
        <ul class="nav-links">
            <li><a href="paginainicial.html">Dashboard</a></li>
            <li><a href="aluno.html">Alunos</a></li>
            <li><a href="prof.html" class="active">Professores</a></li>
            <li><a href="planos.html">Planos</a></li>
            <li><a href="pagamentos.html">Pagamentos</a></li>
            <li><a href="treino.html">Treinos</a></li>
        </ul>
    </nav>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="main-container">
        
        <!-- Bloco do Formulário de Cadastro -->
        <section class="form-container">
            <h2 class="form-title">Cadastrar Professor</h2>
            <form id="form-professor">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" required>
                </div>
                
                <div class="form-group">
                    <label for="especialidade">Especialidade</label>
                    <input type="text" id="especialidade" placeholder="Ex: Musculação" required>
                </div>
                
                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>
        </section>

        <!-- Bloco de Professores Cadastrados -->
        <h2 class="section-title">Professores cadastrados</h2>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Especialidade</th>
                    </tr>
                </thead>
                <tbody id="tabela-professores">
                    <!-- Linha de exemplo inicial baseada no padrão visual da tabela vazia -->
                    <tr class="sem-dados">
                        <td colspan="4" class="empty-message">Nenhum professor cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

<script>
const API = window.API_BASE || (location.port === "5000" ? location.origin : `${location.protocol}//${location.hostname || "127.0.0.1"}:5000`);
const formProf=document.getElementById("form-professor");
const esc=(v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function carregarProfessores(){const tb=document.getElementById("tabela-professores");try{const r=await fetch(`${API}/api/professores`);if(!r.ok)throw Error();const dados=await r.json();tb.innerHTML=dados.length?dados.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.email||"—")}</td><td>${esc(p.telefone||"—")}</td><td>${esc(p.especialidade||"—")}</td></tr>`).join(""):'<tr><td colspan="4" class="empty-message">Nenhum professor cadastrado ainda.</td></tr>';}catch(e){tb.innerHTML='<tr><td colspan="4" class="empty-message">Não foi possível conectar à API.</td></tr>';}}
formProf.addEventListener("submit",async e=>{e.preventDefault();const dados={nome:document.getElementById("nome").value.trim(),email:document.getElementById("email").value.trim(),telefone:document.getElementById("telefone").value.trim(),especialidade:document.getElementById("especialidade").value.trim()};try{const r=await fetch(`${API}/api/professores`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(dados)});const d=await r.json();if(!r.ok)throw Error(d.erro||"Falha no cadastro");formProf.reset();await carregarProfessores();alert(d.mensagem);}catch(err){alert(err.message||"Não foi possível conectar à API.");}});
carregarProfessores();
</script>
</body>
</html>
