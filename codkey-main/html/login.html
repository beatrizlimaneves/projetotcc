<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#241039"><title>Entrar | AcademiaFit</title>
  <link rel="stylesheet" href="../css/tema-roxo.css"><link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand" aria-label="AcademiaFit">
      <img src="../assets/academiafit-logo.png" alt="Logo AcademiaFit: atletas com halteres e identidade roxa" class="auth-logo">
      <p class="brand-tagline">SAÚDE <span>•</span> DISCIPLINA <span>•</span> RESULTADOS</p>
      <h1>Seu próximo nível começa aqui.</h1>
      <p class="brand-copy">Organize sua academia, acompanhe seus alunos e transforme esforço em resultado.</p>
    </section>
    <section class="auth-panel">
      <div class="mobile-logo"><img src="../assets/academiafit-logo.png" alt="Logo AcademiaFit"></div>
      <span class="eyebrow">ÁREA EXCLUSIVA</span><h2>Bem-vindo de volta!</h2>
      <p class="auth-subtitle">Entre com seus dados para acessar o painel.</p>
      <form id="formLogin">
        <div class="form-group"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required placeholder="voce@exemplo.com"></div>
        <div class="form-group"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required placeholder="Digite sua senha"></div>
        <button type="submit" id="btnEntrar">Entrar no sistema <span aria-hidden="true">→</span></button>
        <p id="mensagem" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-footer">Primeiro acesso? <a href="cadastro.html">Criar uma conta</a></p>
      <p class="security-note">🔒 Acesso protegido por e-mail e senha</p>
    </section>
  </main>
<script>
const API = window.API_BASE || (location.port === "5000" ? location.origin : `${location.protocol}//${location.hostname || "127.0.0.1"}:5000`);
document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('mensagem'); const btn = document.getElementById('btnEntrar');
  msg.className = 'form-message'; msg.textContent = 'Verificando seus dados…'; btn.disabled = true;
  try {
    const response = await fetch(`${API}/api/login`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:document.getElementById('email').value.trim(), senha:document.getElementById('senha').value})});
    const data = await response.json(); if (!response.ok) throw new Error(data.erro || 'Não foi possível entrar.');
    sessionStorage.setItem('academiafit_usuario', JSON.stringify(data.usuario));
    window.location.href = 'paginainicial.html';
  } catch (error) { msg.classList.add('error'); msg.textContent = error.message || 'Não foi possível conectar à API. Confira se o Flask está em execução.'; }
  finally { btn.disabled = false; }
});
</script>
</body></html>
