<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | AcademiaFit</title><link rel="stylesheet" href="../css/tema-roxo.css"><link rel="stylesheet" href="../css/login.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-brand"><img src="../assets/academiafit-logo.png" alt="Logo AcademiaFit" class="auth-logo"><p class="brand-tagline">SAÚDE <span>•</span> DISCIPLINA <span>•</span> RESULTADOS</p><h1>Comece sua jornada.</h1><p class="brand-copy">Crie seu acesso para administrar sua academia em um só lugar.</p></section><section class="auth-panel"><div class="mobile-logo"><img src="../assets/academiafit-logo.png" alt="Logo AcademiaFit"></div><span class="eyebrow">NOVO ACESSO</span><h2>Criar conta</h2><p class="auth-subtitle">Preencha os dados para cadastrar seu usuário.</p><form id="formCadastro"><div class="form-group"><label for="nome">Nome completo</label><input id="nome" autocomplete="name" required placeholder="Seu nome"></div><div class="form-group"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com"></div><div class="form-group"><label for="senha">Senha</label><input id="senha" type="password" minlength="6" autocomplete="new-password" required placeholder="Mínimo de 6 caracteres"></div><button id="btnCadastrar" type="submit">Criar minha conta →</button><p id="mensagem" class="form-message" role="status" aria-live="polite"></p></form><p class="auth-footer">Já tem conta? <a href="login.html">Voltar para o login</a></p><p class="security-note">🔒 Sua senha é armazenada com proteção criptográfica</p></section></main>
<script>const API = window.API_BASE || (location.port === "5000" ? location.origin : `${location.protocol}//${location.hostname || "127.0.0.1"}:5000`);document.getElementById('formCadastro').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('mensagem'),btn=document.getElementById('btnCadastrar');msg.className='form-message';msg.textContent='Criando conta…';btn.disabled=true;try{const r=await fetch(`${API}/api/cadastro`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:document.getElementById('nome').value.trim(),email:document.getElementById('email').value.trim(),senha:document.getElementById('senha').value})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível criar a conta.');msg.textContent='Conta criada! Redirecionando para o login…';setTimeout(()=>location.href='login.html',900);}catch(err){msg.classList.add('error');msg.textContent=err.message||'Falha ao conectar com a API.';}finally{btn.disabled=false;}});</script></body></html>
